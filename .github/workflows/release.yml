name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Bump version
        id: bump
        run: |
          project=peekaboo/peekaboo.xcodeproj/project.xcproj
          version="${GITHUB_REF_NAME#v}"
          build=$(sed -nE 's/.*"CURRENT_PROJECT_VERSION": "([0-9]+)".*/\1/p' "$project" | head -1)
          sed -i -E \
            -e "s/(\"CURRENT_PROJECT_VERSION\": \")[0-9]+/\1$((build + 1))/" \
            -e "s/(\"MARKETING_VERSION\": \")[^\"]+/\1$version/" \
            "$project"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit
        id: commit
        uses: planetscale/ghcommit-action@v0.2.22
        with:
          commit_message: "chore: bump version to ${{ steps.bump.outputs.version }}"
          repo: ${{ github.repository }}
          branch: main
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Move the tag to the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME" -f sha=${{ steps.commit.outputs.commit-hash }} -F force=true

  release:
    needs: bump
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Import signing certificate
        env:
          SIGN_CERT: ${{ secrets.SIGN_CERT }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$SIGN_CERT" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Build
        run: |
          DEVELOPER_DIR=$(xcode-select -p) scripts/package.sh \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Development" PROVISIONING_PROFILE_SPECIFIER=
          codesign --verify --strict build/products/Release/peekaboo.app

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/peekaboo.zip --draft --verify-tag --title "$GITHUB_REF_NAME"
